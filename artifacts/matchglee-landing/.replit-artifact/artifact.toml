kind = "web"
previewPath = "/"
title = "MatchGlee Landing Page"
version = "1.0.0"
id = "artifacts/matchglee-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23418

[services.development]
run = "pnpm --filter @workspace/matchglee-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/matchglee-landing", "run", "build" ]
publicDir = "artifacts/matchglee-landing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23418"
BASE_PATH = "/"
